# The dsh-remote-access-proxy profile bundle patch: one row over the profile
# root. A later bundle layer or the user's own profile cordis.patch.yml can
# override it by id (the last write wins per row).
#
# The row names the PACKAGE, not a `./` path: DSH resolves a relative name to an
# absolute file URL, and the configuration editor copies that absolute URL into
# the user patch on its first write — which breaks the row as soon as the DSH
# folder moves (a portable install). A package name resolves from the profile's
# node_modules wherever it lives. The same package is a dual-face module: its
# "." export is the host plugin, its "./client" export the configuration page,
# so the row gets the package's title, description and icon in the Plugins page.
#
# The row id is load-bearing: a plugin's settings namespace IS its profile entry
# id, so renaming it moves the settings form and orphans saved values.

- insert:
    - id: remote-access-proxy
      name: dsh-remote-access-proxy
